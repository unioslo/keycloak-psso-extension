# Platform SSO QR badge login.
# Shipped in the provider jar; ExtendingTheme merges theme-resources/messages into the
# active theme's bundle, so no theme change is needed to pick these up.

pssoBadgeTitle=Sign in with your badge
pssoBadgeInstruction=Hold your badge up to the camera.
pssoBadgeScanning=Looking for your badge...
pssoBadgeScanAgain=Scan again
pssoBadgeUsePassword=Sign in with a password instead
pssoBadgeRetry=That did not work. Press "Scan again" and hold your badge up to the camera.
pssoBadgeUnrecognised=That is not a sign-in badge. Press "Scan again" and hold your badge up to the camera.
pssoBadgeNoCamera=The camera is not available on this Mac. Sign in with a password instead.
pssoBadgeCancelled=Scanning stopped. Press "Scan again" when you are ready.
pssoBadgeTimeout=The camera did not find a badge. Press "Scan again" and hold it a little closer.
pssoBadgeError=Something went wrong while scanning. Press "Scan again".

# Server-side outcomes. Deliberately identical for "unknown badge", "wrong token" and
# "disabled user": the login page is not the place to tell someone which one it was.
pssoBadgeInvalid=We could not sign you in with that badge. Ask an adult for help.
pssoBadgeLocked=This account is locked for a while because of too many failed attempts. Ask an adult for help.
