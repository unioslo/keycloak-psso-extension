# Platform SSO QR badge login - bokmål.
# UTF-8: Keycloak reads these through PropertyResourceBundle(InputStream), which has been
# UTF-8 with an ISO-8859-1 fallback since Java 9, so æ/ø/å need no \uXXXX escaping.

pssoBadgeTitle=Logg inn med kortet ditt
pssoBadgeInstruction=Hold kortet ditt opp mot kameraet.
pssoBadgeScanning=Ser etter kortet ditt...
pssoBadgeScanAgain=Skann på nytt
pssoBadgeUsePassword=Logg inn med passord i stedet
pssoBadgeRetry=Det fungerte ikke. Trykk «Skann på nytt» og hold kortet opp mot kameraet.
pssoBadgeUnrecognised=Dette er ikke et innloggingskort. Trykk «Skann på nytt» og hold kortet ditt opp mot kameraet.
pssoBadgeNoCamera=Kameraet er ikke tilgjengelig på denne maskinen. Logg inn med passord i stedet.
pssoBadgeCancelled=Skanningen ble stoppet. Trykk «Skann på nytt» når du er klar.
pssoBadgeTimeout=Kameraet fant ikke noe kort. Trykk «Skann på nytt» og hold det litt nærmere.
pssoBadgeError=Noe gikk galt under skanningen. Trykk «Skann på nytt».

pssoBadgeInvalid=Vi klarte ikke å logge deg inn med dette kortet. Spør en voksen om hjelp.
pssoBadgeLocked=Kontoen er låst en stund fordi det har vært for mange mislykkede forsøk. Spør en voksen om hjelp.
